<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Dashboard</title>
    <link rel="stylesheet" href="style.css"> <!-- Link to your CSS file for styling -->
</head>
<body>
    <header>
        <h1>Welcome to the Application</h1>
        <nav>
            <ul>
                <li><a href="/dashboard">Dashboard</a></li>
                <li><a href="/profile">Profile</a></li>
                <li><a href="/login">Login</a></li>
                <li><a href="/signup">Sign Up</a></li>
                <li><a href="/logout" id="logout">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Application Overview</h2>
        <p>Use this platform to send push notifications, manage users, and view site details.</p>

        <!-- Display notification form only for users with 'administrator' role -->
        <div id="notification-section" style="display: none;">
            <h3>Create a Notification</h3>
            <form action="/create-push" method="post">
                <label for="siteCode">Site Code:</label>
                <input type="text" id="siteCode" name="siteCode" required />
                <button type="submit">Submit</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Your Application. All rights reserved.</p>
    </footer>

    <script>
        // Check if the user is logged in and has the "administrator" role
        // This script assumes that the user role information is available in the session or a global JS variable
        const userRole = 'administrator'; // This value should be set based on session or authentication

        if (userRole === 'administrator') {
            document.getElementById('notification-section').style.display = 'block';
        }

        // Logout logic
        document.getElementById('logout').addEventListener('click', function (e) {
            e.preventDefault();
            fetch('/logout', {
                method: 'POST',
            })
            .then(response => response.json())
            .then(data => {
                console.log(data.message);
                window.location.href = '/';
            })
            .catch(error => console.error('Logout failed:', error));
        });
    </script>
</body>
</html>
